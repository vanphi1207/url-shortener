spring:
  application:
    name: url-shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:urlshortener}
    password: ${SPRING_DATASOURCE_PASSWORD:Vanphi@1207}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache-ttl: ${APP_CACHE_TTL:24h}
  rate-limit:
    max-requests: ${APP_RATE_LIMIT_MAX_REQUESTS:10}
    window: ${APP_RATE_LIMIT_WINDOW:1m}